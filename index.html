<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Master Entry Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f7ff', 200: '#bae6fd', 500: '#0284c7', 600: '#0369a1', 900: '#0c4a6e' }
          },
          animation: {
            'blob': 'blob 7s infinite',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }
    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen relative overflow-x-hidden">

  <!-- Aesthetic Animated Background Blobs -->
  <div class="fixed inset-0 w-full h-full z-0 overflow-hidden pointer-events-none flex justify-center items-center">
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-brand-200 rounded-full mix-blend-multiply filter blur-[100px] opacity-70 animate-blob"></div>
    <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-purple-200 rounded-full mix-blend-multiply filter blur-[100px] opacity-70 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-1/3 w-96 h-96 bg-pink-200 rounded-full mix-blend-multiply filter blur-[100px] opacity-70 animate-blob animation-delay-4000"></div>
  </div>

  <div class="max-w-4xl mx-auto p-4 md:p-8 relative z-10">
    <!-- Header -->
    <div class="mb-10 text-center md:text-left mt-4">
      <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-500 tracking-tight mb-2">Master Data Entry</h1>
      <p class="text-slate-500 font-medium text-lg">Register a student, assign fees, and mark attendance in one go.</p>
    </div>

    <!-- Single Unified Form -->
    <form id="masterForm" class="space-y-8 relative">

      <!-- SECTION 1: Student Details -->
      <div class="bg-white/60 backdrop-blur-2xl p-6 md:p-8 rounded-3xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] transition-all">
        <h2 class="text-lg font-bold text-slate-800 border-b border-slate-200/50 pb-4 mb-6 flex items-center gap-3">
          <div class="p-2 bg-brand-100 rounded-xl">
            <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          </div>
          1. Student Information
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">First Name</label>
            <input type="text" name="firstName" required placeholder="Jane" class="w-full p-3.5 bg-white/50 backdrop-blur-sm border border-white rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:bg-white focus:border-transparent outline-none transition-all placeholder-slate-400 shadow-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Last Name</label>
            <input type="text" name="lastName" required placeholder="Doe" class="w-full p-3.5 bg-white/50 backdrop-blur-sm border border-white rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:bg-white focus:border-transparent outline-none transition-all placeholder-slate-400 shadow-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
            <input type="email" name="email" required placeholder="jane@example.com" class="w-full p-3.5 bg-white/50 backdrop-blur-sm border border-white rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:bg-white focus:border-transparent outline-none transition-all placeholder-slate-400 shadow-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Phone Number</label>
            <input type="tel" name="phone" required placeholder="+1 234 567 8900" class="w-full p-3.5 bg-white/50 backdrop-blur-sm border border-white rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:bg-white focus:border-transparent outline-none transition-all placeholder-slate-400 shadow-sm">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Assign Batch</label>
            <select name="batch" required class="w-full p-3.5 bg-white/50 backdrop-blur-sm border border-white rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:bg-white focus:border-transparent outline-none transition-all shadow-sm">
              <option value="" disabled selected>Select a target batch...</option>
              <option value="Morning-A1">Morning-A1 (Science)</option>
              <option value="Evening-B2">Evening-B2 (Mathematics)</option>
              <option value="Weekend-C1">Weekend-C1 (Crash Course)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- SECTION 2: Fee Setup & Initial Payment -->
      <div class="bg-white/60 backdrop-blur-2xl p-6 md:p-8 rounded-3xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] transition-all">
        <h2 class="text-lg font-bold text-slate-800 border-b border-slate-200/50 pb-4 mb-6 flex items-center gap-3">
          <div class="p-2 bg-emerald-100 rounded-xl">
            <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          2. Fee Configuration
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Total Course Fee (₹)</label>
            <input type="number" name="totalFee" required min="0" placeholder="50000" class="w-full p-3.5 bg-white/50 backdrop-blur-sm border border-white rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:border-transparent outline-none transition-all placeholder-slate-400 shadow-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Initial Payment (₹)</label>
            <input type="number" name="paidAmount" required min="0" placeholder="10000" class="w-full p-3.5 bg-white/50 backdrop-blur-sm border border-white rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:border-transparent outline-none transition-all placeholder-slate-400 shadow-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Payment Method</label>
            <select name="paymentMethod" required class="w-full p-3.5 bg-white/50 backdrop-blur-sm border border-white rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:border-transparent outline-none transition-all shadow-sm">
              <option value="upi">UPI</option>
              <option value="cash">Cash</option>
              <option value="card">Card / POS</option>
              <option value="bank_transfer">Bank Transfer</option>
            </select>
          </div>
        </div>
      </div>

      <!-- SECTION 3: Initial Attendance -->
      <div class="bg-white/60 backdrop-blur-2xl p-6 md:p-8 rounded-3xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] transition-all">
        <h2 class="text-lg font-bold text-slate-800 border-b border-slate-200/50 pb-4 mb-6 flex items-center gap-3">
          <div class="p-2 bg-amber-100 rounded-xl">
            <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          </div>
          3. First Day Attendance
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-end">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Joining Date</label>
            <input type="date" name="attendanceDate" required class="w-full p-3.5 bg-white/50 backdrop-blur-sm border border-white rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:bg-white focus:border-transparent outline-none transition-all shadow-sm text-slate-600">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Status</label>
            <div class="flex gap-4 p-3.5 border border-white rounded-xl bg-white/50 backdrop-blur-sm shadow-sm">
              <label class="flex items-center gap-2 cursor-pointer group">
                <div class="relative flex items-center justify-center">
                  <input type="radio" name="attendanceStatus" value="present" checked class="peer w-5 h-5 appearance-none border-2 border-slate-300 rounded-full checked:border-brand-500 checked:bg-brand-50 transition-all cursor-pointer">
                  <div class="absolute w-2.5 h-2.5 bg-brand-500 rounded-full opacity-0 peer-checked:opacity-100 transition-all"></div>
                </div>
                <span class="text-sm font-bold text-slate-600 group-hover:text-slate-900 transition-colors">Present</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer group ml-4">
                <div class="relative flex items-center justify-center">
                  <input type="radio" name="attendanceStatus" value="absent" class="peer w-5 h-5 appearance-none border-2 border-slate-300 rounded-full checked:border-amber-500 checked:bg-amber-50 transition-all cursor-pointer">
                  <div class="absolute w-2.5 h-2.5 bg-amber-500 rounded-full opacity-0 peer-checked:opacity-100 transition-all"></div>
                </div>
                <span class="text-sm font-bold text-slate-600 group-hover:text-slate-900 transition-colors">Absent</span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Submit Action -->
      <div class="sticky bottom-6 z-50 bg-slate-900/80 backdrop-blur-xl p-4 md:px-6 rounded-2xl flex items-center justify-between shadow-2xl border border-slate-700 mt-10">
        <div class="hidden md:flex items-center gap-3 pl-2">
          <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
          <p class="text-slate-300 text-sm font-medium">Ready to sync record securely.</p>
        </div>
        <button type="submit" id="submitBtn" class="w-full md:w-auto px-8 py-3.5 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white font-bold rounded-xl transition-all shadow-[0_0_20px_rgba(2,132,199,0.4)] hover:shadow-[0_0_25px_rgba(2,132,199,0.6)] hover:-translate-y-0.5 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
          <span id="btnText">Save Master Record</span>
        </button>
      </div>

    </form>
  </div>
  
  <script>
    // 1. Auto-fill today's date
    document.querySelector('input[name="attendanceDate"]').valueAsDate = new Date();
  
    // 2. Handle SheetDB Submission
    const scriptURL = 'https://sheetdb.io/api/v1/y75cxm5mhyxik'; // <--- YOUR SHEETDB URL INJECTED HERE
    const form = document.forms['masterForm'];
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
  
    form.addEventListener('submit', e => {
      e.preventDefault(); 
      
      // Show loading state
      btnText.innerText = 'Saving to Sheet...';
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
  
      // Convert form data into the JSON format SheetDB expects
      const formData = new FormData(form);
      const dataObj = {};
      formData.forEach((value, key) => { dataObj[key] = value; });
  
      // Send to SheetDB
      fetch(scriptURL, {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: [dataObj] })
      })
      .then(response => response.json())
      .then(data => {
        alert('Success! Student record saved to Google Sheets.');
        form.reset(); 
        document.querySelector('input[name="attendanceDate"]').valueAsDate = new Date(); 
      })
      .catch(error => {
        console.error('Error!', error);
        alert('Something went wrong. Please check your internet connection and try again.');
      })
      .finally(() => {
        btnText.innerText = 'Save Master Record';
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
      });
    });
  </script>
</body>
          </html>
